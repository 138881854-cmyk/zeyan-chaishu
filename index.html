<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>泽言拆书 · 个人知识系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --wood-dark:#1a1410;--wood-mid:#2a1f17;--wood-light:#3d2b1f;
  --paper:#f5ede0;--paper-light:#faf6ef;--paper-dark:#e8dcc8;
  --gold:#c8965a;--gold-light:#d4a574;--gold-dark:#8b6914;
  --bronze:#6d4c1a;--text-dark:#3d2b1f;--text-mid:#6d5544;
  --text-light:#e8dcc8;--text-muted:#a08b76;
  --shelf:#4a3525;--shelf-light:#5d4434;
  --shadow:rgba(0,0,0,0.3);--radius:8px;
  --topbar-h:56px;--bottomnav-h:60px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--wood-dark);color:var(--text-dark);overflow-x:hidden;min-height:100vh;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}

/* === Password Gate === */
#auth-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--wood-dark),var(--wood-mid));}
#auth-overlay.hidden{display:none;}
.auth-box{background:var(--paper);border-radius:var(--radius);padding:44px 36px 36px;width:340px;max-width:90vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);border:1px solid var(--gold);}
.auth-logo{font-family:'Noto Serif SC',serif;font-size:26px;font-weight:700;color:var(--wood-dark);margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text-muted);margin-bottom:28px;letter-spacing:2px;}
.auth-box input{width:100%;padding:14px 16px;border:2px solid var(--paper-dark);border-radius:var(--radius);font-size:20px;text-align:center;letter-spacing:6px;background:var(--paper-light);color:var(--text-dark);outline:none;transition:border-color .3s;box-sizing:border-box;}
.auth-box input:focus{border-color:var(--gold);}
.auth-box button{width:100%;padding:14px;margin-top:16px;border-radius:var(--radius);background:var(--wood-light);color:var(--paper);font-size:16px;font-weight:600;transition:background .3s;letter-spacing:4px;}
.auth-box button:hover{background:var(--shelf);}
.auth-error{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px;}

/* === Loading === */
#loading{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--wood-dark);}
#loading .logo{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--gold);margin-bottom:20px;letter-spacing:4px;}
.spinner{width:36px;height:36px;border:3px solid rgba(200,150,90,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* === App Layout === */
#app{display:none;min-height:100vh;background:linear-gradient(180deg,var(--wood-dark) 0%,var(--wood-mid) 100%);}

/* === Top Bar === */
.topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + var(--safe-top));padding-top:var(--safe-top);background:rgba(26,20,16,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,150,90,0.15);z-index:500;display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:20px;}
.topbar .logo{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:2px;white-space:nowrap;}
.nav-tabs{display:flex;gap:4px;}
.nav-tabs button{padding:8px 14px;font-size:14px;color:var(--text-muted);border-radius:6px;transition:all .2s;font-weight:500;}
.nav-tabs button.active{color:var(--gold);background:rgba(200,150,90,0.1);}
.nav-tabs button:hover{color:var(--gold-light);}

/* === Main Content === */
#main{padding-top:calc(var(--topbar-h) + var(--safe-top));padding-bottom:calc(var(--bottomnav-h) + var(--safe-bottom) + 16px);min-height:100vh;}

/* === Bottom Nav (Mobile) === */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottomnav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(26,20,16,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(200,150,90,0.15);z-index:500;justify-content:space-around;align-items:center;}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;font-size:11px;color:var(--text-muted);transition:color .2s;min-width:48px;min-height:44px;justify-content:center;}
.bottom-nav button.active{color:var(--gold);}
.bottom-nav button .nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.bottom-nav button .nav-icon svg{width:20px;height:20px;}

/* === Stats Bar === */
.stats-bar{display:flex;gap:0;background:var(--wood-light);margin:12px 16px;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(200,150,90,0.15);}
.stat-item{flex:1;text-align:center;padding:10px 4px;border-right:1px solid rgba(200,150,90,0.1);}
.stat-item:last-child{border-right:none;}
.stat-num{font-size:18px;font-weight:700;color:var(--gold);font-family:'Noto Serif SC',serif;}
.stat-label{font-size:10px;color:var(--text-muted);margin-top:2px;}

/* === Controls Bar === */
.controls-bar{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:180px;padding:10px 14px;background:var(--wood-light);border:1px solid rgba(200,150,90,0.15);border-radius:var(--radius);color:var(--paper);font-size:14px;outline:none;}
.search-box::placeholder{color:var(--text-muted);}
.search-box:focus{border-color:var(--gold);}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:6px 12px;font-size:12px;color:var(--text-muted);background:var(--wood-light);border-radius:16px;transition:all .2s;white-space:nowrap;}
.chip.active{color:var(--wood-dark);background:var(--gold);font-weight:500;}
.sort-select{padding:8px 12px;background:var(--wood-light);border:1px solid rgba(200,150,90,0.15);border-radius:var(--radius);color:var(--paper);font-size:13px;outline:none;}

/* === Book Grid === */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:0 16px 24px;}
.book-card{background:var(--paper);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid rgba(200,150,90,0.1);position:relative;}
.book-card:active{transform:scale(0.97);}
.book-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shadow);}
.book-cover{width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,var(--shelf),var(--wood-light));display:flex;align-items:center;justify-content:center;padding:16px 12px;position:relative;}
.book-cover-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:600;color:var(--gold-light);text-align:center;line-height:1.4;}
.book-rating{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--wood-dark);}
.rating-S{background:var(--gold);}
.rating-A{background:#cd7f32;color:var(--paper);}
.rating-B{background:#a08b76;color:var(--paper);}
.book-info{padding:8px 10px;}
.book-title{font-size:13px;font-weight:600;color:var(--text-dark);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.book-meta{font-size:11px;color:var(--text-muted);margin-top:4px;display:flex;gap:6px;align-items:center;}
.book-cat{font-size:10px;color:var(--accent,#8b5e3c);background:rgba(139,94,60,.12);border-radius:8px;padding:1px 6px;white-space:nowrap;}
.book-dots{display:flex;gap:3px;margin-top:6px;}
.book-dots span{width:6px;height:6px;border-radius:50%;background:var(--paper-dark);}
.book-dots span.on{background:var(--gold);}

/* === Shelf View === */
.shelf-section{padding:0 16px 24px;}
.shelf-category{margin-bottom:20px;}
.shelf-cat-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(200,150,90,0.15);}
.shelf-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.shelf-item{background:var(--paper-dark);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text-dark);cursor:pointer;transition:background .2s;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.shelf-item:hover{background:var(--paper);}
.shelf-item.analyzed{border-left:3px solid var(--gold);}

/* === Card Wall === */
.card-wall{columns:2;column-gap:10px;padding:0 12px 24px;}
.card-wall-item{break-inside:avoid;margin-bottom:10px;border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s;}
.card-wall-item:active{transform:scale(0.97);}
.card-wall-item img{width:100%;border-radius:var(--radius);}
.card-wall-item .card-label{padding:6px 8px;font-size:11px;color:var(--text-muted);background:var(--wood-light);}

/* === Quotes === */
.quotes-container{padding:0 16px 24px;}
.quote-card{background:var(--paper);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;border-left:3px solid var(--gold);position:relative;transition:transform .2s;}
.quote-card:active{transform:scale(0.98);}
.quote-text{font-family:'Noto Serif SC',serif;font-size:15px;line-height:1.7;color:var(--text-dark);}
.quote-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:6px;}
.quote-book{font-size:12px;color:var(--gold-dark);font-weight:500;}
.quote-tags{display:flex;gap:4px;flex-wrap:wrap;}
.quote-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--paper-dark);color:var(--text-mid);}
.quote-copy{font-size:11px;color:var(--text-muted);padding:4px 10px;border-radius:4px;background:var(--paper-dark);transition:all .2s;}
.quote-copy:hover{background:var(--gold);color:var(--wood-dark);}

/* === Knowledge Graph === */
.graph-container{padding:0 16px 24px;}
.graph-svg-wrap{background:var(--wood-light);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(200,150,90,0.1);position:relative;}
.graph-svg{width:100%;display:block;}
.graph-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.graph-info{position:absolute;top:12px;left:12px;background:rgba(26,20,16,0.9);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--paper);max-width:240px;display:none;border:1px solid rgba(200,150,90,0.2);}
.graph-info.show{display:block;}
.graph-info .gi-title{font-weight:600;color:var(--gold);margin-bottom:4px;}
.graph-info .gi-desc{color:var(--text-light);line-height:1.5;}

/* === Dashboard === */
.dashboard{padding:0 16px 24px;}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.dash-card{background:var(--wood-light);border-radius:var(--radius);padding:16px;border:1px solid rgba(200,150,90,0.1);}
.dash-card .dc-num{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--gold);}
.dash-card .dc-label{font-size:12px;color:var(--text-muted);margin-top:4px;}
.dash-card .dc-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.chart-wrap{background:var(--wood-light);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid rgba(200,150,90,0.1);}
.chart-title{font-size:14px;font-weight:600;color:var(--gold);margin-bottom:12px;}
.chart-canvas-wrap{position:relative;height:200px;}

/* === Detail Overlay === */
#detail-overlay{position:fixed;inset:0;z-index:8000;background:rgba(26,20,16,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
#detail-overlay.show{display:flex;}
.detail-panel{background:var(--paper);border-radius:12px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.detail-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--paper-dark);background:var(--paper-light);}
.detail-header .dh-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:600;color:var(--text-dark);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.detail-close{width:36px;height:36px;border-radius:50%;background:var(--paper-dark);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-mid);transition:background .2s;flex-shrink:0;}
.detail-close:hover{background:var(--gold);color:var(--wood-dark);}
.detail-tabs{display:flex;border-bottom:1px solid var(--paper-dark);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.detail-tabs button{padding:12px 16px;font-size:14px;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;font-weight:500;}
.detail-tabs button.active{color:var(--gold-dark);border-bottom-color:var(--gold);}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.detail-body::-webkit-scrollbar{width:6px;}
.detail-body::-webkit-scrollbar-thumb{background:var(--paper-dark);border-radius:3px;}

/* MD Reader */
.md-reader{padding:24px 28px 60px;max-width:none;}
.md-reader h1{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--text-dark);margin-bottom:16px;line-height:1.4;}
.md-reader h2{font-family:'Noto Serif SC',serif;font-size:18px;color:var(--gold-dark);margin:24px 0 12px;border-bottom:1px solid var(--paper-dark);padding-bottom:6px;}
.md-reader h3{font-size:16px;color:var(--text-dark);margin:20px 0 10px;}
.md-reader p{font-size:15px;line-height:1.85;color:var(--text-dark);margin-bottom:14px;}
.md-reader blockquote{border-left:3px solid var(--gold);padding:10px 16px;margin:14px 0;background:var(--paper-light);border-radius:0 6px 6px 0;}
.md-reader blockquote p{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--text-mid);margin:0;}
.md-reader strong{color:var(--gold-dark);font-weight:600;}
.md-reader ul,.md-reader ol{padding-left:20px;margin-bottom:14px;}
.md-reader li{font-size:15px;line-height:1.8;color:var(--text-dark);margin-bottom:6px;}
.md-reader code{background:var(--paper-dark);padding:2px 6px;border-radius:3px;font-size:13px;}
.md-reader table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;}
.md-reader th,.md-reader td{border:1px solid var(--paper-dark);padding:8px 10px;text-align:left;}
.md-reader th{background:var(--paper-light);font-weight:600;}

/* Audio Player */
.audio-section{padding:20px;}
.audio-player{background:var(--paper-light);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.audio-player audio{width:100%;margin-bottom:8px;}
.audio-player .ap-title{font-size:13px;color:var(--text-mid);}
.audio-list{margin-top:8px;}
.audio-item{padding:10px 14px;border-radius:6px;font-size:13px;color:var(--text-dark);cursor:pointer;transition:background .2s;}
.audio-item:hover{background:var(--paper-dark);}
.audio-item.playing{background:var(--gold);color:var(--wood-dark);font-weight:500;}
.audio-note{text-align:center;padding:40px 20px;color:var(--text-muted);}
.audio-note .an-icon{font-size:40px;margin-bottom:12px;}
.audio-note .an-text{font-size:14px;line-height:1.6;}

/* Card Gallery */
.card-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px;}
.card-gallery-item{border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s;}
.card-gallery-item:active{transform:scale(0.97);}
.card-gallery-item img{width:100%;}

/* Koubo */
.koubo-section{padding:20px;}
.koubo-section h3{font-size:16px;color:var(--gold-dark);margin-bottom:12px;}
.koubo-item{background:var(--paper-light);border-radius:6px;padding:14px 16px;margin-bottom:12px;border-left:3px solid var(--gold);}
.koubo-item h4{font-size:14px;color:var(--text-dark);margin-bottom:6px;}
.koubo-item p{font-size:14px;line-height:1.7;color:var(--text-mid);}

/* === Lightbox === */
#lightbox{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;}
#lightbox.show{display:flex;}
.lightbox-img{max-width:92vw;max-height:82vh;border-radius:4px;object-fit:contain;}
.lightbox-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.1);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;}
.lightbox-nav.prev{left:12px;}
.lightbox-nav.next{right:12px;}
.lightbox-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:13px;}

/* === Footer === */
.footer{text-align:center;padding:20px;font-size:12px;color:var(--text-muted);border-top:1px solid rgba(200,150,90,0.08);}

/* === Responsive === */
@media(max-width:768px){
  .topbar .logo{font-size:16px;}
  .nav-tabs{display:none;}
  .bottom-nav{display:flex;}
  #main{padding-bottom:calc(var(--bottomnav-h) + var(--safe-bottom) + 20px);}
  .book-grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:0 10px 20px;}
  .book-cover-text{font-size:12px;}
  .book-title{font-size:12px;}
  .book-meta{font-size:10px;}
  .stats-bar{margin:8px 10px;}
  .stat-num{font-size:16px;}
  .stat-label{font-size:9px;}
  .controls-bar{padding:0 10px 10px;}
  .search-box{min-width:140px;font-size:13px;}
  .sort-select{font-size:12px;}
  .card-wall{columns:2;column-gap:8px;padding:0 8px 20px;}
  .quote-card{padding:14px;}
  .quote-text{font-size:14px;}
  .md-reader{padding:16px 14px 40px;}
  .md-reader h1{font-size:20px;}
  .md-reader p{font-size:14px;line-height:1.8;}
  .detail-panel{max-height:100vh;border-radius:0;height:100vh;}
  #detail-overlay{padding:0;}
  .detail-header{padding:10px 14px;}
  .dh-title{font-size:16px;}
  .detail-tabs button{padding:10px 12px;font-size:13px;}
  .dash-cards{grid-template-columns:repeat(2,1fr);}
  .card-gallery{grid-template-columns:1fr;padding:12px;}
  .shelf-list{grid-template-columns:repeat(2,1fr);}
  .chart-canvas-wrap{height:160px;}
}

@media(max-width:380px){
  .book-grid{grid-template-columns:repeat(2,1fr);}
  .stats-bar{flex-wrap:wrap;}
  .stat-item{min-width:33%;}
}

@media(min-width:769px){
  .bottom-nav{display:none!important;}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--wood-dark);}
::-webkit-scrollbar-thumb{background:var(--shelf);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dark);}

/* === MD Toolbar === */
.md-toolbar{display:flex;gap:8px;padding:10px 16px;background:var(--paper-dark);border-bottom:1px solid rgba(200,150,90,0.2);position:sticky;top:0;z-index:5;}
.md-tool-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;font-size:13px;color:var(--text-mid);background:var(--paper-light);border:1px solid var(--gold);border-radius:6px;cursor:pointer;transition:all .2s;font-weight:500;}
.md-tool-btn:active{transform:scale(0.95);}
.md-tool-btn:hover{background:var(--gold);color:#fff;border-color:var(--gold);}
.md-tool-btn svg{width:15px;height:15px;}

/* === Reader Mode (E-ink Friendly) === */
#reader-overlay{position:fixed;inset:0;z-index:9600;background:#f5ede0;display:none;}
#reader-overlay.show{display:block;}
.reader-topbar{position:absolute;top:0;left:0;right:0;height:46px;background:#e8dcc8;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10;transition:opacity .3s;}
.reader-topbar.hidden{opacity:0;pointer-events:none;}
.reader-exit{display:flex;align-items:center;gap:4px;font-size:14px;color:#3d2b1f;background:none;border:none;cursor:pointer;font-weight:500;white-space:nowrap;}
.reader-title{font-size:13px;color:#6d5544;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px;}
.reader-controls{display:flex;gap:6px;align-items:center;}
.reader-controls button{width:30px;height:30px;border-radius:4px;background:#d4a574;color:#3d2b1f;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.reader-controls button:active{background:#c8965a;}

.reader-page-area{position:absolute;top:0;bottom:0;left:0;right:0;overflow:hidden;}
.reader-page-content{height:100%;column-width:calc(100vw - 56px);column-gap:56px;column-fill:auto;padding:50px 28px 50px;box-sizing:border-box;transition:transform .2s ease-out;will-change:transform;font-family:'Noto Serif SC',serif;color:#2a1f17;}
.reader-page-content .md-reader{padding:0;max-width:none;}
.reader-page-content h1{font-size:1.5em;font-weight:700;margin-bottom:.8em;line-height:1.4;color:#1a1410;}
.reader-page-content h2{font-size:1.2em;font-weight:600;margin:1.2em 0 .6em;border-bottom:1px solid #c8965a;padding-bottom:.3em;color:#3d2b1f;}
.reader-page-content h3{font-size:1.1em;font-weight:600;margin:1em 0 .5em;color:#3d2b1f;}
.reader-page-content p{font-size:1em;line-height:1.9;margin-bottom:.8em;text-align:justify;}
.reader-page-content blockquote{border-left:3px solid #c8965a;padding:.5em 1em;margin:.8em 0;background:#faf6ef;border-radius:0 4px 4px 0;}
.reader-page-content blockquote p{font-size:.95em;color:#5d4434;margin:0;}
.reader-page-content strong{color:#8b6914;font-weight:600;}
.reader-page-content em{color:#5d4434;}
.reader-page-content ul,.reader-page-content ol{padding-left:1.5em;margin-bottom:.8em;}
.reader-page-content li{font-size:1em;line-height:1.85;margin-bottom:.3em;}
.reader-page-content code{background:#e8dcc8;padding:2px 6px;border-radius:3px;font-size:.9em;}
.reader-page-content table{width:100%;border-collapse:collapse;margin:1em 0;font-size:.9em;}
.reader-page-content th,.reader-page-content td{border:1px solid #d4c4a8;padding:6px 8px;text-align:left;}
.reader-page-content th{background:#faf6ef;font-weight:600;}

.reader-tap-left{position:absolute;top:0;bottom:0;left:0;width:30%;z-index:5;}
.reader-tap-center{position:absolute;top:20%;bottom:20%;left:30%;right:30%;z-index:5;}
.reader-tap-right{position:absolute;top:0;bottom:0;right:0;width:30%;z-index:5;}

.reader-bottombar{position:absolute;bottom:0;left:0;right:0;height:34px;background:#e8dcc8;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:10;transition:opacity .3s;}
.reader-bottombar.hidden{opacity:0;pointer-events:none;}
.reader-page-info{font-size:11px;color:#6d5544;white-space:nowrap;min-width:50px;text-align:center;}
.reader-progress{flex:1;height:3px;background:#d4c4a8;border-radius:2px;overflow:hidden;}
.reader-progress-fill{height:100%;background:#c8965a;transition:width .2s ease;border-radius:2px;}

/* === Generating Overlay === */
#gen-overlay{position:fixed;inset:0;z-index:9800;background:rgba(26,20,16,.85);display:none;align-items:center;justify-content:center;flex-direction:column;}
#gen-overlay.show{display:flex;}
.gen-spinner{width:40px;height:40px;border:3px solid rgba(200,150,90,.2);border-top-color:#c8965a;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
.gen-text{color:#c8965a;font-size:14px;letter-spacing:1px;}

/* Fade animation */
.fade-in{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* === Read Badge === */
.book-card.read .book-cover{background:linear-gradient(135deg,var(--shelf),var(--wood-light));}
.read-badge{position:absolute;bottom:8px;left:8px;background:rgba(200,150,90,0.9);color:var(--wood-dark);font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600;}

/* === MD Font Control === */
.md-font-ctrl{display:flex;gap:4px;margin-left:auto;}
.md-font-btn{min-width:36px;padding:7px 8px!important;font-size:12px!important;}

/* === Knowledge Cards === */
.kcards-container{padding:0 16px 24px;max-width:720px;margin:0 auto;}
.kcards-book-container{padding:16px;}
.kcard{background:var(--paper);border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid rgba(200,150,90,0.15);box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:transform .2s;}
.kcard:active{transform:scale(0.99);}
.kcard-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
.kcard-topic{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:600;color:var(--text-dark);line-height:1.4;flex:1;}
.kcard-tags{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.kcard-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--paper-dark);color:var(--text-mid);}
.kcard-section{margin-bottom:12px;}
.kcard-label{font-size:11px;font-weight:600;margin-bottom:4px;letter-spacing:1px;}
.kcard-hook-label{color:#e67e22;}
.kcard-insight-label{color:#8e44ad;}
.kcard-action-label{color:#27ae60;}
.kcard-hook{font-size:14px;line-height:1.6;color:#5d4434;font-style:italic;}
.kcard-insight{font-size:15px;line-height:1.7;color:var(--text-dark);font-family:'Noto Serif SC',serif;font-weight:500;}
.kcard-actions{padding-left:18px;margin:0;}
.kcard-actions li{font-size:14px;line-height:1.7;color:var(--text-dark);margin-bottom:4px;}
.kcard-footer{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--paper-dark);flex-wrap:wrap;}
.kcard-book{font-size:12px;color:var(--gold-dark);font-weight:500;cursor:pointer;}
.kcard-rating{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--gold);color:var(--wood-dark);font-weight:600;}
.kcard-copy{font-size:12px;color:var(--text-muted);padding:5px 12px;border-radius:6px;background:var(--paper-dark);transition:all .2s;margin-left:auto;}
.kcard-copy:hover{background:var(--gold);color:var(--wood-dark);}

@media(max-width:768px){
  .kcard{padding:16px;margin-bottom:12px;}
  .kcard-topic{font-size:15px;}
  .kcard-hook{font-size:13px;}
  .kcard-insight{font-size:14px;}
  .kcard-actions li{font-size:13px;}
  .bottom-nav button{min-width:42px;font-size:10px;}
  .bottom-nav button .nav-icon svg{width:18px;height:18px;}
}
</style>
</head>
<body>

</div>

<div id="reader-overlay">

    <button class="reader-exit" onclick="exitReaderMode()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
